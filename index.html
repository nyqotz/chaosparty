<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaos Party Controller</title>
    <script src="https://download.playfab.com/PlayFabClientApi.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Arial Black', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .screen { display: none; width: 90%; max-width: 350px; background: #1e1e1e; padding: 25px; border-radius: 15px; border: 3px solid #333; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .active { display: block; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 8px; border: 2px solid #333; background: #2a2a2a; color: white; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background-color: #00FF66; color: #121212; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .avatar-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #8B4513; margin: 0 auto 15px auto; display: block; background: #2a2a2a; }
    </style>
</head>
<body>

    <!-- Schermata Profilo -->
    <div id="screen-profile" class="screen active">
        <h1 style="color: #00FF66; font-size: 20px;">IL TUO PROFILO</h1>
        <img id="avatarPreview" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23aaa'><path d='M12 2C7.58 2 4 5.58 4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v7H6v-7c0-3.31 2.69-6 6-6zm-3 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z'/></svg>">
        <input type="text" id="nicknameInput" placeholder="Il tuo Nickname" maxlength="12">
        <input type="file" id="fileInput" accept="image/*" onchange="previewFile()" style="margin-bottom: 15px; color: #aaa; width: 100%;">
        <button class="btn" onclick="saveProfile()">ENTRA IN PARTITA</button>
    </div>

    <!-- Schermata Lobby & Pronto -->
    <div id="screen-lobby" class="screen">
        <h2 style="font-size: 16px; color: #00FF66;">SEI DENTRO!</h2>
        <p style="font-size: 13px; color: #aaa;">Tutti pronti per iniziare?</p>
        <button id="readyBtn" class="btn" onclick="toggleReady()">SONO PRONTO!</button>
    </div>

    <!-- Schermata Assegnazione Squadra -->
    <div id="screen-team" class="screen">
        <h1 id="teamTitle" style="font-size: 22px; color: #FF0055;">SQUADRA</h1>
        <p id="teamSubtitle" style="font-size: 14px; color: #aaa;"></p>
        
        <div id="captainSection" style="display:none; margin-top: 15px;">
            <p style="font-size: 12px; color: #00FF66;">Sei il Capitano! Scegli il nome:</p>
            <input type="text" id="teamNameInput" placeholder="Nome Squadra" maxlength="15">
            <button class="btn" onclick="submitTeamName()">CONFERMA NOME</button>
        </div>
    </div>

    <script>
        PlayFab.settings.titleId = "71EAC";
        let roomCode = '';
        let sessionTicket = '';
        let playFabId = '';
        let avatarBase64 = '';
        let isReady = false;
        let pollInterval = null;
        let myTeamColor = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            roomCode = urlParams.get('room');
        };

        function previewFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 60;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    avatarBase64 = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('avatarPreview').src = avatarBase64;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if(!nickname) { alert('Inserisci un nickname!'); return; }
            if(!roomCode) { alert('Scansiona nuovamente il QR code dalla TV.'); return; }

            PlayFabClientApi.LoginWithCustomID({
                CustomId: 'phone_' + Math.random().toString(36).substring(2),
                CreateAccount: true
            }, function(res) {
                sessionTicket = res.data.SessionTicket;
                playFabId = res.data.PlayFabId;

                PlayFabClientApi.ExecuteCloudScript({
                    FunctionName: "JoinRoom",
                    FunctionParameter: { roomId: roomCode, nickname: nickname, avatar: avatarBase64 },
                    GeneratePlayStreamEvent: true
                }, function(cloudRes) {
                    document.getElementById('screen-profile').classList.remove('active');
                    document.getElementById('screen-lobby').classList.add('active');
                    // Inizia a controllare se le squadre sono state assegnate
                    pollInterval = setInterval(checkTeamAssignment, 2000);
                }, function(err) { alert('Errore ingresso: ' + err.errorMessage); });
            }, function(err) { alert('Login fallito: ' + err.errorMessage); });
        }

        function toggleReady() {
            isReady = !isReady;
            const btn = document.getElementById('readyBtn');
            btn.innerText = isReady ? 'ANNULLA' : 'SONO PRONTO!';
            btn.style.backgroundColor = isReady ? '#FF0055' : '#00FF66';

            PlayFabClientApi.ExecuteCloudScript({
                FunctionName: "SetReady",
                FunctionParameter: { roomId: roomCode, ready: isReady }
            }, function(res) {}, function(err) {});
        }

        function checkTeamAssignment() {
            PlayFabClientApi.GetSharedGroupData({
                SharedGroupId: roomCode,
                Keys: [playFabId]
            }, function(res) {
                if (res.data && res.data[playFabId]) {
                    let profile = JSON.parse(res.data[playFabId].Value);
                    if (profile.team && profile.team !== "") {
                        clearInterval(pollInterval);
                        myTeamColor = profile.team;
                        showTeamScreen(profile.team, profile.isCaptain);
                    }
                }
            }, function(err) {});
        }

        function showTeamScreen(teamColor, isCaptain) {
            document.getElementById('screen-lobby').classList.remove('active');
            document.getElementById('screen-team').classList.add('active');

            document.getElementById('teamTitle').innerText = "SQUADRA " + teamColor.toUpperCase();
            document.getElementById('teamSubtitle').innerText = "Preparati a vincere!";

            if (isCaptain) {
                document.getElementById('captainSection').style.display = 'block';
            }
        }

        function submitTeamName() {
            let teamName = document.getElementById('teamNameInput').value.trim();
            if(!teamName) { alert('Inserisci un nome!'); return; }

            PlayFabClientApi.ExecuteCloudScript({
                FunctionName: "SetTeamName",
                FunctionParameter: { roomId: roomCode, teamName: teamName, teamColor: myTeamColor } 
            }, function(res) {
                alert('Nome squadra salvato con successo!');
                document.getElementById('captainSection').style.display = 'none';
                document.getElementById('teamSubtitle').innerText = "Nome squadra: " + teamName;
            }, function(err) {});
        }
    </script>
</body>
</html>
