<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaos Party Controller</title>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Arial Black', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .screen { display: none; width: 90%; max-width: 350px; background: #1e1e1e; padding: 25px; border-radius: 15px; border: 3px solid #333; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .active { display: block; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; font-size: 20px; text-align: center; border-radius: 8px; border: 2px solid #333; background: #2a2a2a; color: white; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background-color: #00FF66; color: #121212; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .avatar-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #8B4513; margin: 0 auto 15px auto; display: block; background: #2a2a2a; }
    </style>
</head>
<body>

    <!-- Schermata 1: Inserimento PIN -->
    <div id="screen-pin" class="screen active">
        <h1 style="color: #FF0055; font-size: 22px;">CHAOS PARTY</h1>
        <p style="font-size: 13px; color: #aaa;">Inserisci il PIN della stanza:</p>
        <input type="number" id="pinInput" placeholder="----" maxlength="4">
        <button id="btnAvanti" class="btn" onclick="joinRoom()">AVANTI</button>
    </div>

    <!-- Schermata 2: Profilo -->
    <div id="screen-profile" class="screen">
        <h1 style="color: #00FF66; font-size: 20px;">IL TUO PROFILO</h1>
        <img id="avatarPreview" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23aaa'><path d='M12 2C7.58 2 4 5.58 4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v7H6v-7c0-3.31 2.69-6 6-6zm-3 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z'/></svg>">
        <input type="text" id="nicknameInput" placeholder="Il tuo Nickname" maxlength="12">
        <input type="file" id="fileInput" accept="image/*" onchange="previewFile()" style="margin-bottom: 15px; color: #aaa; width: 100%;">
        <button id="enterBtn" class="btn" onclick="saveProfile()">ENTRA IN PARTITA</button>
    </div>

    <!-- Schermata 3: Lobby -->
    <div id="screen-lobby" class="screen">
        <h2 style="font-size: 16px; color: #00FF66;">SEI DENTRO!</h2>
        <p style="font-size: 13px; color: #aaa;">Tutti pronti per iniziare?</p>
        <button id="readyBtn" class="btn" onclick="toggleReady()">SONO PRONTO!</button>
    </div>

    <!-- Schermata 4: Squadra -->
    <div id="screen-team" class="screen">
        <h1 id="teamTitle" style="font-size: 22px; color: #FF0055;">SQUADRA</h1>
        <p id="teamSubtitle" style="font-size: 14px; color: #aaa;"></p>
        <div id="captainSection" style="display:none; margin-top: 15px;">
            <p style="font-size: 12px; color: #00FF66;">Sei il Capitano! Scegli il nome:</p>
            <input type="text" id="teamNameInput" placeholder="Nome Squadra" maxlength="15">
            <button class="btn" onclick="submitTeamName()">CONFERMA NOME</button>
        </div>
    </div>

    <script>
        var titleId = "71EAC";
        var roomCode = '';
        var sessionTicket = '';
        var playFabId = '';
        var avatarBase64 = '';
        var isReady = false;
        var pollInterval = null;
        var heartbeatInterval = null;
        var myTeamColor = "";

        window.onload = function() {
            try {
                var urlParams = new URLSearchParams(window.location.search);
                var r = urlParams.get('room');
                if(r) { document.getElementById('pinInput').value = r; }
            } catch(e) {}
        };

        function joinRoom() {
            var btn = document.getElementById('btnAvanti');
            btn.innerText = "CARICAMENTO...";

            roomCode = document.getElementById('pinInput').value.trim();
            if(roomCode.length !== 4) { 
                alert('Inserisci un PIN valido a 4 cifre.'); 
                btn.innerText = "AVANTI";
                return; 
            }

            var requestBody = JSON.stringify({
                TitleId: titleId,
                CustomId: 'phone_' + Math.random().toString(36).substring(2),
                CreateAccount: true
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/LoginWithCustomID", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: requestBody
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.code === 200) {
                    sessionTicket = data.data.SessionTicket;
                    playFabId = data.data.PlayFabId;
                    document.getElementById('screen-pin').classList.remove('active');
                    document.getElementById('screen-profile').classList.add('active');
                } else {
                    alert('Errore Login PlayFab: ' + JSON.stringify(data));
                    btn.innerText = "AVANTI";
                }
            })
            .catch(function(err) {
                alert('Errore di connessione Rete: ' + err.message);
                btn.innerText = "AVANTI";
            });
        }

        function previewFile() {
            var file = document.getElementById('fileInput').files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var MAX_SIZE = 60;
                    var width = img.width, height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    avatarBase64 = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('avatarPreview').src = avatarBase64;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            var nickname = document.getElementById('nicknameInput').value.trim();
            if(!nickname) { alert('Inserisci un nickname!'); return; }

            var btn = document.getElementById('enterBtn');
            btn.innerText = "ATTENDI...";
            btn.style.backgroundColor = "#555";

            var requestBody = JSON.stringify({
                FunctionName: "JoinRoom",
                FunctionParameter: { roomId: roomCode, nickname: nickname, avatar: avatarBase64 },
                GeneratePlayStreamEvent: true
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/ExecuteCloudScript", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: requestBody
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.code === 200 && data.data.FunctionResult && data.data.FunctionResult.success) {
                    document.getElementById('screen-profile').classList.remove('active');
                    document.getElementById('screen-lobby').classList.add('active');
                    
                    pollInterval = setInterval(checkTeamAssignment, 2000);
                    startHeartbeat(); // Avvia il segnale periodico di presenza
                } else {
                    btn.innerText = "ENTRA IN PARTITA";
                    btn.style.backgroundColor = "#00FF66";
                    alert('Errore CloudScript: ' + (data.data.Error ? data.data.Error.Message : JSON.stringify(data)));
                }
            })
            .catch(function(err) {
                btn.innerText = "ENTRA IN PARTITA";
                btn.style.backgroundColor = "#00FF66";
                alert('Errore Rete Profilo: ' + err.message);
            });
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(function() {
                if (!roomCode || !playFabId) return;
                var nickname = document.getElementById('nicknameInput').value.trim();
                
                var profileData = JSON.stringify({
                    nickname: nickname,
                    avatar: avatarBase64,
                    ready: isReady,
                    team: "",
                    isCaptain: false
                });

                fetch("https://" + titleId + ".playfabapi.com/Client/UpdateSharedGroupData", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                    body: JSON.stringify({
                        SharedGroupId: roomCode,
                        Data: { [playFabId]: profileData }
                    })
                }).catch(function(e) {});
            }, 3000); // Invia un segnale ogni 3 secondi
        }

        function toggleReady() {
            isReady = !isReady;
            var btn = document.getElementById('readyBtn');
            btn.innerText = isReady ? 'ANNULLA' : 'SONO PRONTO!';
            btn.style.backgroundColor = isReady ? '#FF0055' : '#00FF66';

            var requestBody = JSON.stringify({
                FunctionName: "SetReady",
                FunctionParameter: { roomId: roomCode, ready: isReady }
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/ExecuteCloudScript", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: requestBody
            })
            .then(function(response) { return response.json(); })
            .catch(function(err) { alert('Errore Rete Pronto: ' + err.message); });
        }

        function checkTeamAssignment() {
            var requestBody = JSON.stringify({
                SharedGroupId: roomCode,
                Keys: [playFabId]
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/GetSharedGroupData", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: requestBody
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.code === 200 && data.data.Data && data.data.Data[playFabId]) {
                    var profile = JSON.parse(data.data.Data[playFabId].Value);
                    if (profile.team && profile.team !== "") {
                        clearInterval(pollInterval);
                        clearInterval(heartbeatInterval);
                        myTeamColor = profile.team;
                        showTeamScreen(profile.team, profile.isCaptain);
                    }
                }
            })
            .catch(function(err) {});
        }

        function showTeamScreen(teamColor, isCaptain) {
            document.getElementById('screen-lobby').classList.remove('active');
            document.getElementById('screen-team').classList.add('active');
            document.getElementById('teamTitle').innerText = "SQUADRA " + teamColor.toUpperCase();
            document.getElementById('teamSubtitle').innerText = "Preparati a vincere!";
            if (isCaptain) {
                document.getElementById('captainSection').style.display = 'block';
            }
        }

        function submitTeamName() {
            var teamName = document.getElementById('teamNameInput').value.trim();
            if(!teamName) { alert('Inserisci un nome!'); return; }

            var requestBody = JSON.stringify({
                FunctionName: "SetTeamName",
                FunctionParameter: { roomId: roomCode, teamName: teamName, teamColor: myTeamColor }
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/ExecuteCloudScript", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: requestBody
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.code === 200) {
                    alert('Nome squadra salvato!');
                    document.getElementById('captainSection').style.display = 'none';
                    document.getElementById('teamSubtitle').innerText = "Nome squadra: " + teamName;
                } else {
                    alert('Errore Salvataggio: ' + JSON.stringify(data));
                }
            })
            .catch(function(err) {
                alert('Errore Rete Nome: ' + err.message);
            });
        }
    </script>
</body>
</html>
