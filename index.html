<script>
        var titleId = "71EAC";
        var roomCode = '';
        var sessionTicket = '';
        var playFabId = '';
        var avatarBase64 = '';
        var isReady = false;
        var isMinigameReady = false;
        var pollInterval = null;
        var heartbeatInterval = null;
        var myTeamColor = "";
        var currentGameState = "LOBBY";
        
        var localShakes = 0;
        var lastShakeTime = 0;

        // Variabili per il sistema di Crop Circolare
        let cropImage = new Image();
        let canvas, ctx;
        let imgX = 0, imgY = 0, imgScale = 1;
        let isDragging = false;
        let startX, startY;
        let containerSize = 260;

        window.onload = function() {
            try {
                var urlParams = new URLSearchParams(window.location.search);
                var r = urlParams.get('room');
                if(r) { document.getElementById('pinInput').value = r; }
            } catch(e) {}

            canvas = document.getElementById('cropCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = containerSize;
            canvas.height = containerSize;

            setupCropListeners();
        };

        function joinRoom() {
            var btn = document.getElementById('btnAvanti');
            btn.innerText = "CARICAMENTO...";
            roomCode = document.getElementById('pinInput').value.trim();
            if(roomCode.length !== 4) { alert('PIN non valido'); btn.innerText = "AVANTI"; return; }

            var requestBody = JSON.stringify({
                TitleId: titleId,
                CustomId: 'phone_' + Math.random().toString(36).substring(2),
                CreateAccount: true
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/LoginWithCustomID", {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: requestBody
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    sessionTicket = data.data.SessionTicket;
                    playFabId = data.data.PlayFabId;
                    document.getElementById('screen-pin').classList.remove('active');
                    document.getElementById('screen-profile').classList.add('active');
                } else { btn.innerText = "AVANTI"; }
            });
        }

        // --- Logica di Ritaglio Circolare Corretta e Centrata ---
        function initCrop(input) {
            var file = input.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (e) {
                cropImage.onload = function () {
                    // Passa alla schermata di ritaglio
                    document.getElementById('screen-profile').classList.remove('active');
                    document.getElementById('screen-crop').classList.add('active');

                    // Calcola la scala iniziale affinché l'immagine copra perfettamente tutto il cerchio senza spazi vuoti
                    let maxDim = Math.max(cropImage.width, cropImage.height);
                    imgScale = containerSize / maxDim;
                    document.getElementById('zoomRange').value = imgScale;

                    // Centra l'immagine alla perfezione nel canvas
                    imgX = (containerSize - cropImage.width * imgScale) / 2;
                    imgY = (containerSize - cropImage.height * imgScale) / 2;

                    drawCanvas();
                }
                cropImage.src = e.target.result;
            }
            reader.readAsDataURL(file);
            input.value = ""; 
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(imgX, imgY);
            ctx.scale(imgScale, imgScale);
            ctx.drawImage(cropImage, 0, 0);
            ctx.restore();
        }

        function setupCropListeners() {
            let container = document.getElementById('cropContainer');

            container.addEventListener('mousedown', startDrag);
            container.addEventListener('mousemove', onDrag);
            container.addEventListener('mouseup', endDrag);
            container.addEventListener('mouseleave', endDrag);

            container.addEventListener('touchstart', (e) => { startDrag(e.touches[0]); }, {passive: true});
            container.addEventListener('touchmove', (e) => { onDrag(e.touches[0]); }, {passive: true});
            container.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            isDragging = true;
            startX = e.clientX - imgX;
            startY = e.clientY - imgY;
        }

        function onDrag(e) {
            if (!isDragging) return;
            imgX = e.clientX - startX;
            imgY = e.clientY - startY;
            drawCanvas();
        }

        function endDrag() {
            isDragging = false;
        }

        function adjustZoom(val) {
            let oldScale = imgScale;
            imgScale = parseFloat(val);
            
            let center = containerSize / 2;
            imgX = center - (center - imgX) * (imgScale / oldScale);
            imgY = center - (center - imgY) * (imgScale / oldScale);

            drawCanvas();
        }

        function confirmCrop() {
            let finalCanvas = document.createElement('canvas');
            let finalSize = 300; 
            finalCanvas.width = finalSize;
            finalCanvas.height = finalSize;
            let finalCtx = finalCanvas.getContext('2d');

            finalCtx.beginPath();
            finalCtx.arc(finalSize / 2, finalSize / 2, finalSize / 2, 0, Math.PI * 2, true);
            finalCtx.clip();

            let ratio = finalSize / containerSize;
            finalCtx.scale(ratio, ratio);
            finalCtx.drawImage(canvas, 0, 0);

            avatarBase64 = finalCanvas.toDataURL('image/jpeg', 0.9);
            document.getElementById('avatarPreview').src = avatarBase64;

            document.getElementById('screen-crop').classList.remove('active');
            document.getElementById('screen-profile').classList.add('active');
        }
        // ---------------------------------------------

        function saveProfile() {
            var nickname = document.getElementById('nicknameInput').value.trim();
            if(!nickname) { alert('Inserisci un nickname'); return; }
            if(!avatarBase64) { alert('Scegli e ritaglia una foto per il tuo avatar!'); return; }

            var requestBody = JSON.stringify({
                FunctionName: "JoinRoom",
                FunctionParameter: { roomId: roomCode, nickname: nickname, avatar: avatarBase64 }
            });

            fetch("https://" + titleId + ".playfabapi.com/Client/ExecuteCloudScript", {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket }, body: requestBody
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    document.getElementById('screen-profile').classList.remove('active');
                    document.getElementById('screen-lobby').classList.add('active');
                    pollInterval = setInterval(checkGameLoop, 2000);
                    startHeartbeat();
                }
            });
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(function() {
                if (!roomCode || !playFabId) return;
                var nickname = document.getElementById('nicknameInput').value.trim();
                var profileData = JSON.stringify({
                    nickname: nickname, avatar: avatarBase64, ready: isReady,
                    team: myTeamColor, isCaptain: false, ping: Date.now(), score: localShakes,
                    minigameReady: isMinigameReady
                });
                fetch("https://" + titleId + ".playfabapi.com/Client/UpdateSharedGroupData", {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                    body: JSON.stringify({ SharedGroupId: roomCode, Data: { [playFabId]: profileData } })
                }).catch(e => {});
            }, 5000);
        }

        function toggleReady() {
            if (currentGameState !== "LOBBY") return;

            isReady = !isReady;
            var btn = document.getElementById('readyBtn');
            btn.innerText = isReady ? 'ANNULLA' : 'SONO PRONTO!';
            btn.style.backgroundColor = isReady ? '#ff0055' : '#00ff66';
            btn.style.boxShadow = isReady ? '0 5px 0 #990033' : '0 5px 0 #00993d';

            fetch("https://" + titleId + ".playfabapi.com/Client/ExecuteCloudScript", {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: JSON.stringify({ FunctionName: "SetReady", FunctionParameter: { roomId: roomCode, ready: isReady } })
            });
        }

        function submitTeamName() {
            var teamName = document.getElementById('teamNameInput').value.trim();
            if(!teamName) { alert('Inserisci un nome per la squadra!'); return; }

            var teamKey = "TeamName_" + myTeamColor; 
            var dataObj = {};
            dataObj[teamKey] = teamName;

            fetch("https://" + titleId + ".playfabapi.com/Client/UpdateSharedGroupData", {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: JSON.stringify({ SharedGroupId: roomCode, Data: dataObj })
            })
            .then(res => res.json())
            .then(data => {
                if(data.code === 200) {
                    document.getElementById('teamTitle').innerText = teamName.toUpperCase();
                    document.getElementById('captainSection').innerHTML = "<p style='color:#00ff66; font-size:14px;'>Nome registrato! In attesa dell'altra squadra...</p>";
                } else {
                    alert('Errore salvataggio nome');
                }
            });
        }

        function setMinigameReady() {
            isMinigameReady = true;
            var btn = document.getElementById('minigameReadyBtn');
            btn.innerText = "ATTESA ALTRI...";
            btn.style.backgroundColor = "#555";
            btn.style.boxShadow = "0 5px 0 #222";
            btn.disabled = true;

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                        document.getElementById('sensorStatus').innerText = "Sensori attivi!";
                        document.getElementById('sensorStatus').style.color = "#00ff66";
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
                document.getElementById('sensorStatus').innerText = "Sensori attivi!";
                document.getElementById('sensorStatus').style.color = "#00ff66";
            }

            var nickname = document.getElementById('nicknameInput').value.trim();
            var profileData = JSON.stringify({
                nickname: nickname, avatar: avatarBase64, ready: isReady,
                team: myTeamColor, isCaptain: false, ping: Date.now(), score: localShakes,
                minigameReady: true
            });
            fetch("https://" + titleId + ".playfabapi.com/Client/UpdateSharedGroupData", {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: JSON.stringify({ SharedGroupId: roomCode, Data: { [playFabId]: profileData } })
            }).catch(e => {});
        }

        function checkGameLoop() {
            fetch("https://" + titleId + ".playfabapi.com/Client/GetSharedGroupData", {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Authorization': sessionTicket },
                body: JSON.stringify({ SharedGroupId: roomCode, GetMembers: true })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200 && data.data.Data) {
                    
                    if (data.data.Data["GlobalState"]) {
                        var newState = data.data.Data["GlobalState"].Value;
                        if (newState !== currentGameState) {
                            currentGameState = newState;
                            handleStateChange(currentGameState);
                        }
                    }

                    if (data.data.Data[playFabId]) {
                        var profile = JSON.parse(data.data.Data[playFabId].Value);
                        if (profile.team && profile.team !== "") {
                            myTeamColor = profile.team;
                        }
                    }

                    if (myTeamColor) {
                        var keyName = "TeamName_" + myTeamColor; 
                        if (data.data.Data[keyName]) {
                            var customName = data.data.Data[keyName].Value;
                            document.getElementById('teamTitle').innerText = customName.toUpperCase();
                            document.getElementById('teamSubtitle').innerText = "Squadra " + myTeamColor;
                        } else {
                            document.getElementById('teamTitle').innerText = "SQUADRA " + myTeamColor.toUpperCase();
                            document.getElementById('teamSubtitle').innerText = "Sei nella squadra " + myTeamColor;
                        }

                        if (data.data.Data[playFabId]) {
                            var profile = JSON.parse(data.data.Data[playFabId].Value);
                            if (profile.isCaptain) {
                                document.getElementById('captainSection').style.display = 'block';
                            }
                        }
                    }
                }
            });
        }

        function handleStateChange(state) {
            var screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));

            if (state === "LOBBY") {
                document.getElementById('screen-lobby').classList.add('active');
            } else if (state === "TEAM_NAMING") {
                document.getElementById('screen-team').classList.add('active');
            } else if (state === "ROULETTE") {
                document.getElementById('screen-roulette').classList.add('active');
            } else if5 (state === "TUTORIAL") {
                document.getElementById('screen-tutorial').classList.add('active');
            } else if (state === "PLAYING") {
                document.getElementById('screen-minigame').classList.add('active');
            }
        }

        function handleMotion(e) {
            if (currentGameState !== "PLAYING") return;
            var acc = e.accelerationIncludingGravity;
            if (!acc) return;

            var currentTime = Date.now();
            if (currentTime - lastShakeTime > 120) {
                var threshold = 18;
                var movement = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);

                if (movement > threshold) {
                    localShakes++;
                    lastShakeTime = currentTime;
                    document.getElementById('scoreDisplay').innerText = localShakes;
                    if (navigator.vibrate) { navigator.vibrate(40); }
                }
            }
        }
    </script>
